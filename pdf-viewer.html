<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Viewer</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('academis-theme');
      if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e){}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%232563EB'/><path d='M15 10h13l7 7v20a1.6 1.6 0 0 1-1.6 1.6H15a1.6 1.6 0 0 1-1.6-1.6V11.6A1.6 1.6 0 0 1 15 10Z' fill='%23F6F8FA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#F6F8FA;
    --surface:#FFFFFF;
    --surface-hover:#EEF2F6;
    --border:#D9E0E7;
    --border-soft:#E7EBEF;
    --ink:#17212B;
    --ink-dim:#66737F;
    --ink-faint:#9AA5AF;
    --note:#2563EB;
    --note-soft:rgba(37,99,235,0.1);
    --danger:#DC4C4C;
    --danger-soft:rgba(220,76,76,0.1);
  }
  :root[data-theme="dark"]{
    --bg:#10151B;
    --surface:#181F27;
    --surface-hover:#212A34;
    --border:#2C3844;
    --border-soft:#212B35;
    --ink:#E6EDF3;
    --ink-dim:#8B98A5;
    --ink-faint:#586674;
    --note:#4C8DFF;
    --note-soft:rgba(76,141,255,0.14);
    --danger:#F0665F;
    --danger-soft:rgba(240,102,95,0.14);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:14px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* ── toolbar ─────────────────────────────────────────── */
  .toolbar{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--border-soft);
    flex-shrink:0;
    flex-wrap:wrap;
  }
  .toolbar .group{
    display:flex;
    align-items:center;
    gap:4px;
  }
  .toolbar .sep{
    width:1px;
    height:22px;
    background:var(--border-soft);
    margin:0 4px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:30px;
    height:30px;
    padding:0 8px;
    border-radius:6px;
    color:var(--ink-dim);
    cursor:pointer;
    border:1px solid transparent;
    background:none;
    font-family:inherit;
    font-size:13px;
    gap:5px;
    white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); background:var(--surface-hover); border-color:var(--border-soft); }
  .btn:active{ transform:scale(0.96); }
  .btn svg{ width:15px; height:15px; flex-shrink:0; }
  .btn.active{ color:var(--note); background:var(--note-soft); border-color:var(--note-soft); }
  .btn.danger:hover{ color:var(--danger); background:var(--danger-soft); }
  .btn-label{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em; margin-right:2px; }

  .page-info{
    display:flex;
    align-items:center;
    gap:4px;
    font-size:13px;
    color:var(--ink-dim);
  }
  .page-info input{
    width:44px;
    text-align:center;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:5px;
    padding:4px 2px;
    outline:none;
  }
  .page-info input:focus{ border-color:var(--note); }
  .page-info .total{ color:var(--ink-faint); }

  .zoom-display{
    font-size:12px;
    color:var(--ink-faint);
    min-width:42px;
    text-align:center;
    font-variant-numeric:tabular-nums;
  }

  .file-name{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-faint);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    max-width:220px;
  }

  /* ── canvas area ─────────────────────────────────────── */
  .viewer{
    flex:1;
    overflow:auto;
    display:flex;
    justify-content:center;
    padding:20px;
    position:relative;
  }
  .viewer canvas{
    box-shadow:0 2px 16px rgba(23,33,43,0.12);
    border-radius:4px;
    max-width:100%;
    height:auto !important;
  }
  :root[data-theme="dark"] .viewer canvas{
    box-shadow:0 2px 16px rgba(0,0,0,0.4);
  }

  /* ── loading / error ─────────────────────────────────── */
  .status{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100%;
    gap:14px;
    color:var(--ink-faint);
    text-align:center;
    padding:20px;
  }
  .status .art{ font-size:12px; line-height:1.4; white-space:pre; }
  .status .msg{ font-size:15px; color:var(--ink-dim); }
  .status .msg b{ color:var(--danger); }
  .spinner{
    width:28px; height:28px;
    border:3px solid var(--border-soft);
    border-top-color:var(--note);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }

  /* ── responsive ──────────────────────────────────────── */
  @media (max-width:600px){
    .toolbar{ padding:6px 8px; gap:4px; }
    .btn{ min-width:26px; height:26px; padding:0 5px; }
    .btn svg{ width:13px; height:13px; }
    .file-name{ display:none; }
    .viewer{ padding:10px; }
  }
</style>
</head>
<body>

<div class="toolbar" id="toolbar">
  <div class="group">
    <button class="btn" id="prevBtn" title="previous page (←)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="page-info">
      <input id="pageInput" type="number" min="1" value="1" />
      <span class="total" id="pageTotal">/ 0</span>
    </div>
    <button class="btn" id="nextBtn" title="next page (→)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <div class="group">
    <button class="btn" id="zoomOutBtn" title="zoom out (-)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <div class="zoom-display" id="zoomDisplay">100%</div>
    <button class="btn" id="zoomInBtn" title="zoom in (+)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="btn" id="fitBtn" title="fit to width">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
  </div>

  <div class="sep"></div>

  <div class="group">
    <button class="btn" id="rotateCcwBtn" title="rotate left (Shift+R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2v6h6"/><path d="M2.66 15.57a10 10 0 1 0 .57-8.38"/></svg>
    </button>
    <button class="btn" id="rotateCwBtn" title="rotate right (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
    </button>
  </div>

  <span class="file-name" id="fileName"></span>
</div>

<div class="viewer" id="viewer">
  <div class="status" id="loadingStatus">
    <div class="spinner"></div>
    <div class="msg">Loading PDF…</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ── PDF.js setup ───────────────────────────────────────
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  // ── State ──────────────────────────────────────────────
  let pdfDoc = null;
  let currentPage = 1;
  let totalPages = 0;
  let scale = 1.5;
  let rotation = 0; // 0, 90, 180, 270
  const MIN_SCALE = 0.25;
  const MAX_SCALE = 5.0;
  const SCALE_STEP = 0.25;

  // ── DOM refs ───────────────────────────────────────────
  const viewer = document.getElementById('viewer');
  const loadingStatus = document.getElementById('loadingStatus');
  const pageInput = document.getElementById('pageInput');
  const pageTotal = document.getElementById('pageTotal');
  const zoomDisplay = document.getElementById('zoomDisplay');
  const fileName = document.getElementById('fileName');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const fitBtn = document.getElementById('fitBtn');
  const rotateCwBtn = document.getElementById('rotateCwBtn');
  const rotateCcwBtn = document.getElementById('rotateCcwBtn');

  // ── PDF URL ────────────────────────────────────────────
  // Default: plantanatomy.pdf next to this viewer. Override with ?url=...
  const params = new URLSearchParams(location.search);
  const pdfUrl = params.get('url') || 'Notes/Class%2012/Biology/Botany/PlantAnatomy/assets/plantanatomy.pdf';
  fileName.textContent = decodeURIComponent(pdfUrl.split('/').pop().split('?')[0]);

  // ── Render ─────────────────────────────────────────────
  async function renderPage(num){
    if(!pdfDoc) return;
    if(num < 1) num = 1;
    if(num > totalPages) num = totalPages;
    currentPage = num;
    pageInput.value = num;

    const page = await pdfDoc.getPage(num);
    const unscaledViewport = page.getViewport({ rotation: rotation });
    // Fit width: scale so the page width matches the viewer width
    const viewerWidth = viewer.clientWidth - 40; // padding
    const fitScale = viewerWidth / unscaledViewport.width;
    const finalScale = Math.min(Math.max(fitScale * (scale / 1.5), MIN_SCALE), MAX_SCALE);
    const viewport = page.getViewport({ scale: finalScale, rotation: rotation });

    // Remove old canvas
    const old = viewer.querySelector('canvas');
    if(old) old.remove();

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = viewport.width + 'px';
    canvas.style.height = viewport.height + 'px';

    viewer.appendChild(canvas);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;
    updateButtons();
  }

  function updateButtons(){
    prevBtn.style.opacity = currentPage <= 1 ? '0.3' : '1';
    nextBtn.style.opacity = currentPage >= totalPages ? '0.3' : '1';
    zoomDisplay.textContent = Math.round(scale * 100) + '%';
  }

  // ── Load PDF ───────────────────────────────────────────
  async function loadPDF(){
    try{
      const loadingTask = pdfjsLib.getDocument(pdfUrl);
      pdfDoc = await loadingTask.promise;
      totalPages = pdfDoc.numPages;
      pageTotal.textContent = '/ ' + totalPages;
      pageInput.max = totalPages;
      await renderPage(1);
    } catch(e){
      loadingStatus.innerHTML =
        '<div class="art">┌──────────────┐\n│ □      □ □   │\n│ □ □ □        │\n│      □ □ □   │\n└──────────────┘</div>' +
        '<div class="msg"><b>Could not load PDF</b></div>' +
        '<div class="msg" style="font-size:13px;color:var(--ink-faint)">' + (e.message || 'Unknown error') + '</div>';
    }
  }

  // ── Controls ───────────────────────────────────────────
  prevBtn.addEventListener('click', () => { if(currentPage > 1) renderPage(currentPage - 1); });
  nextBtn.addEventListener('click', () => { if(currentPage < totalPages) renderPage(currentPage + 1); });

  pageInput.addEventListener('change', () => {
    const n = parseInt(pageInput.value, 10);
    if(!isNaN(n)) renderPage(n);
  });
  pageInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); pageInput.blur(); pageInput.dispatchEvent(new Event('change')); }
  });

  zoomInBtn.addEventListener('click', () => {
    if(scale < MAX_SCALE){ scale = Math.min(scale + SCALE_STEP, MAX_SCALE); renderPage(currentPage); }
  });
  zoomOutBtn.addEventListener('click', () => {
    if(scale > MIN_SCALE){ scale = Math.max(scale - SCALE_STEP, MIN_SCALE); renderPage(currentPage); }
  });
  fitBtn.addEventListener('click', () => { scale = 1.5; renderPage(currentPage); });

  rotateCwBtn.addEventListener('click', () => { rotation = (rotation + 90) % 360; renderPage(currentPage); });
  rotateCcwBtn.addEventListener('click', () => { rotation = (rotation + 270) % 360; renderPage(currentPage); });

  // ── Keyboard shortcuts ─────────────────────────────────
  document.addEventListener('keydown', (e) => {
    // Don't intercept if user is typing in the page input
    if(e.target === pageInput) return;

    switch(e.key){
      case 'ArrowLeft':
      case 'ArrowUp':
        e.preventDefault();
        if(currentPage > 1) renderPage(currentPage - 1);
        break;
      case 'ArrowRight':
      case 'ArrowDown':
        e.preventDefault();
        if(currentPage < totalPages) renderPage(currentPage + 1);
        break;
      case '+': case '=':
        e.preventDefault();
        zoomInBtn.click();
        break;
      case '-':
        e.preventDefault();
        zoomOutBtn.click();
        break;
      case 'R':
        if(e.shiftKey){ e.preventDefault(); rotateCcwBtn.click(); }
        else { e.preventDefault(); rotateCwBtn.click(); }
        break;
      case '0':
        e.preventDefault();
        fitBtn.click();
        break;
    }
  });

  // ── Theme toggle (click on file name area) ─────────────
  // Quick theme toggle by double-clicking the file name
  fileName.addEventListener('dblclick', () => {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('academis-theme', next); } catch(e){}
    // Re-render to fix canvas colors if needed
    renderPage(currentPage);
  });

  // ── Init ───────────────────────────────────────────────
  loadPDF();
})();
</script>
</body>
</html>
