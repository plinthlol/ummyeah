<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plant Anatomy — PDF</title>
<script>
  (function(){
    try{
      var saved = localStorage.getItem('academis-theme');
      if(saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    } catch(e){}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='11' fill='%232563EB'/><path d='M15 10h13l7 7v20a1.6 1.6 0 0 1-1.6 1.6H15a1.6 1.6 0 0 1-1.6-1.6V11.6A1.6 1.6 0 0 1 15 10Z' fill='%23F6F8FA'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#F6F8FA;
    --surface:#FFFFFF;
    --surface-hover:#EEF2F6;
    --border:#D9E0E7;
    --border-soft:#E7EBEF;
    --ink:#17212B;
    --ink-dim:#66737F;
    --ink-faint:#9AA5AF;
    --note:#2563EB;
    --note-soft:rgba(37,99,235,0.1);
    --danger:#DC4C4C;
  }
  :root[data-theme="dark"]{
    --bg:#10151B;
    --surface:#181F27;
    --surface-hover:#212A34;
    --border:#2C3844;
    --border-soft:#212B35;
    --ink:#E6EDF3;
    --ink-dim:#8B98A5;
    --ink-faint:#586674;
    --note:#4C8DFF;
    --note-soft:rgba(76,141,255,0.14);
    --danger:#F0665F;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:14px; display:flex; flex-direction:column; overflow:hidden;
  }
  .toolbar{
    display:flex; align-items:center; gap:6px; padding:8px 14px;
    background:var(--surface); border-bottom:1px solid var(--border-soft);
    flex-shrink:0; flex-wrap:wrap;
  }
  .group{ display:flex; align-items:center; gap:4px; }
  .sep{ width:1px; height:22px; background:var(--border-soft); margin:0 4px; }
  .btn{
    display:flex; align-items:center; justify-content:center;
    min-width:30px; height:30px; padding:0 8px; border-radius:6px;
    color:var(--ink-dim); cursor:pointer; border:1px solid transparent;
    background:none; font-family:inherit; font-size:13px; gap:5px; white-space:nowrap;
  }
  .btn:hover{ color:var(--ink); background:var(--surface-hover); border-color:var(--border-soft); }
  .btn:active{ transform:scale(0.96); }
  .btn svg{ width:15px; height:15px; flex-shrink:0; }
  .btn:disabled{ opacity:0.3; cursor:default; pointer-events:none; }
  .page-info{ display:flex; align-items:center; gap:4px; font-size:13px; color:var(--ink-dim); }
  .page-info input{
    width:44px; text-align:center; font-family:inherit; font-size:13px;
    color:var(--ink); background:var(--bg); border:1px solid var(--border);
    border-radius:5px; padding:4px 2px; outline:none;
  }
  .page-info input:focus{ border-color:var(--note); }
  .page-info .total{ color:var(--ink-faint); }
  .zoom-display{ font-size:12px; color:var(--ink-faint); min-width:42px; text-align:center; font-variant-numeric:tabular-nums; }
  .viewer{
    flex:1; overflow:auto; display:flex; flex-direction:column;
    align-items:center; padding:20px; gap:20px;
  }
  .page-canvas-wrap{ position:relative; }
  .page-canvas-wrap canvas{
    display:block; box-shadow:0 2px 16px rgba(23,33,43,0.12); border-radius:4px;
  }
  :root[data-theme="dark"] .page-canvas-wrap canvas{ box-shadow:0 2px 16px rgba(0,0,0,0.4); }
  .status{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; gap:14px; color:var(--ink-faint); text-align:center; padding:20px;
  }
  .status .msg{ font-size:15px; color:var(--ink-dim); }
  .status .msg b{ color:var(--danger); }
  .spinner{
    width:28px; height:28px; border:3px solid var(--border-soft);
    border-top-color:var(--note); border-radius:50%; animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
</head>
<body>

<div class="toolbar">
  <div class="group">
    <button class="btn" id="prevBtn" title="previous page (arrow left)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="page-info">
      <input id="pageInput" type="number" min="1" value="1" />
      <span class="total" id="pageTotal">/ 0</span>
    </div>
    <button class="btn" id="nextBtn" title="next page (arrow right)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" id="zoomOutBtn" title="zoom out (-)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <input class="zoom-display" id="zoomDisplay" type="text" value="100%" />
    <button class="btn" id="zoomInBtn" title="zoom in (+)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="btn" id="fitBtn" title="fit to width (0)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>
    </button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button class="btn" id="rotateCcwBtn" title="rotate left (Shift+R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 2v6h6"/><path d="M2.66 15.57a10 10 0 1 0 .57-8.38"/></svg>
    </button>
    <button class="btn" id="rotateCwBtn" title="rotate right (R)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38"/></svg>
    </button>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="status" id="loadingStatus">
    <div class="spinner"></div>
    <div class="msg">Loading PDF…</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  var pdfDoc = null;
  var currentPage = 1;
  var totalPages = 0;
  var scale = 1.0;
  var rotation = 0;
  var MIN_SCALE = 0.25;
  var MAX_SCALE = 5.0;
  var SCALE_STEP = 0.25;

  var viewer = document.getElementById('viewer');
  var pageInput = document.getElementById('pageInput');
  var pageTotal = document.getElementById('pageTotal');
  var zoomDisplay = document.getElementById('zoomDisplay');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var zoomInBtn = document.getElementById('zoomInBtn');
  var zoomOutBtn = document.getElementById('zoomOutBtn');
  var fitBtn = document.getElementById('fitBtn');
  var rotateCwBtn = document.getElementById('rotateCwBtn');
  var rotateCcwBtn = document.getElementById('rotateCcwBtn');

  var pdfUrl = 'assets/plantanatomy.pdf';
  var renderedPages = {};

  function renderAllPages(){
    if(!pdfDoc) return;
    viewer.innerHTML = '';
    renderedPages = {};

    var chain = Promise.resolve();
    for(var i = 1; i <= totalPages; i++){
      (function(num){
        chain = chain.then(function(){
          return pdfDoc.getPage(num).then(function(page){
            var baseViewport = page.getViewport({ scale: 1, rotation: rotation });
            var wrap = document.createElement('div');
            wrap.className = 'page-canvas-wrap';
            wrap.setAttribute('data-page', num);

            var viewerWidth = viewer.clientWidth - 40;
            if(viewerWidth < 100) viewerWidth = 600;
            var fitScale = (viewerWidth / baseViewport.width) * scale;
            var viewport = page.getViewport({ scale: fitScale, rotation: rotation });

            var canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = viewport.width + 'px';
            canvas.style.height = viewport.height + 'px';

            wrap.appendChild(canvas);
            viewer.appendChild(wrap);

            var ctx = canvas.getContext('2d');
            return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
              renderedPages[num] = wrap;
            });
          });
        });
      })(i);
    }
    chain.then(function(){ updateButtons(); setupObserver(); });
  }

  function scrollToPage(num){
    if(num < 1) num = 1;
    if(num > totalPages) num = totalPages;
    currentPage = num;
    pageInput.value = num;
    var wrap = renderedPages[num];
    if(wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    updateButtons();
  }

  function updateButtons(){
    prevBtn.disabled = currentPage <= 1;
    nextBtn.disabled = currentPage >= totalPages;
    zoomDisplay.value = Math.round(scale * 100) + '%';
  }

  var observer = null;
  function setupObserver(){
    if(observer) observer.disconnect();
    observer = new IntersectionObserver(function(entries){
      for(var i = 0; i < entries.length; i++){
        if(entries[i].isIntersecting){
          var num = parseInt(entries[i].target.getAttribute('data-page'), 10);
          if(!isNaN(num)){ currentPage = num; pageInput.value = num; updateButtons(); }
          break;
        }
      }
    }, { root: viewer, threshold: 0.5 });
    Object.keys(renderedPages).forEach(function(k){ observer.observe(renderedPages[k]); });
  }

  function reRender(){
    var savedPage = currentPage;
    renderAllPages();
    // scroll to saved page after a tick
    setTimeout(function(){ scrollToPage(savedPage); }, 100);
  }

  function loadPDF(){
    pdfjsLib.getDocument(pdfUrl).promise.then(function(doc){
      pdfDoc = doc;
      totalPages = doc.numPages;
      pageTotal.textContent = '/ ' + totalPages;
      pageInput.max = totalPages;
      renderAllPages();
    }, function(err){
      viewer.innerHTML =
        '<div class="status">' +
        '<div class="msg"><b>Could not load PDF</b></div>' +
        '<div class="msg" style="font-size:13px;color:var(--ink-faint)">' + (err.message || 'Unknown error') + '</div>' +
        '</div>';
    });
  }

  prevBtn.addEventListener('click', function(){ if(currentPage > 1) scrollToPage(currentPage - 1); });
  nextBtn.addEventListener('click', function(){ if(currentPage < totalPages) scrollToPage(currentPage + 1); });

  pageInput.addEventListener('change', function(){
    var n = parseInt(pageInput.value, 10);
    if(!isNaN(n)) scrollToPage(n);
  });
  pageInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); pageInput.blur(); pageInput.dispatchEvent(new Event('change')); }
  });

  zoomInBtn.addEventListener('click', function(){ if(scale < MAX_SCALE){ scale = Math.min(scale + SCALE_STEP, MAX_SCALE); reRender(); } });
  zoomOutBtn.addEventListener('click', function(){ if(scale > MIN_SCALE){ scale = Math.max(scale - SCALE_STEP, MIN_SCALE); reRender(); } });
  fitBtn.addEventListener('click', function(){ scale = 1.0; reRender(); });

  zoomDisplay.addEventListener('change', function(){
    var val = parseInt(zoomDisplay.value.replace('%',''), 10);
    if(!isNaN(val)){
      scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, val / 100));
      reRender();
    } else {
      zoomDisplay.value = Math.round(scale * 100) + '%';
    }
  });
  zoomDisplay.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); zoomDisplay.blur(); }

  rotateCwBtn.addEventListener('click', function(){ rotation = (rotation + 90) % 360; reRender(); });
  rotateCcwBtn.addEventListener('click', function(){ rotation = (rotation + 270) % 360; reRender(); });

  document.addEventListener('keydown', function(e){
    if(e.target === pageInput) return;
    switch(e.key){
      case 'ArrowLeft': case 'ArrowUp': e.preventDefault(); prevBtn.click(); break;
      case 'ArrowRight': case 'ArrowDown': e.preventDefault(); nextBtn.click(); break;
      case '+': case '=': e.preventDefault(); zoomInBtn.click(); break;
      case '-': e.preventDefault(); zoomOutBtn.click(); break;
      case 'R': e.preventDefault(); (e.shiftKey ? rotateCcwBtn : rotateCwBtn).click(); break;
      case '0': e.preventDefault(); fitBtn.click(); break;
    }
  });

  loadPDF();
})();
</script>
</body>
</html>
